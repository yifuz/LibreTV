services:
  libretv:
    build: .
    image: libretv-local:custom
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Generated by npm run setup:local; each device has its own credentials.
    env_file:
      - ./.env.local
    environment:
      RECOMMEND_CACHE_DIR: /app/.local/cache
    volumes:
      - recommend-cache:/app/.local/cache

volumes:
  recommend-cache:
